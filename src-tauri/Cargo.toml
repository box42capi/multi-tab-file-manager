[package]
name = "ufm"
version = "0.1.0"
description = "UFM —— Chrome 风格多标签文件管理器（Tauri 2 + Vue 3 + TypeScript + Rust）"
authors = ["UFM"]
edition = "2021"

[lib]
# `_lib` 后缀用于避免 lib 与 bin 在 Windows 上重名冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "ufm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
